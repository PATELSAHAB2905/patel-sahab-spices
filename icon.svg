<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#5C1414" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  <!-- Spice bowl & Mortar Pestle Art -->
  <g transform="translate(156, 130)">
    <!-- Mortar Bowl -->
    <path d="M 10 120 C 15 190, 85 210, 100 210 C 115 210, 185 190, 190 120 Z" fill="url(#goldGrad)"/>
    <ellipse cx="100" cy="120" rx="90" ry="22" fill="#78350F" stroke="#FDE68A" stroke-width="3"/>
    <ellipse cx="100" cy="120" rx="80" ry="16" fill="#DC2626"/>
    <!-- Pestle -->
    <path d="M 130 30 L 160 50 L 105 130 L 80 120 Z" fill="#F3F4F6" stroke="#991B1B" stroke-width="3" rx="10"/>
    <circle cx="145" cy="40" r="15" fill="url(#goldGrad)"/>
    <!-- Spice Leaves / Aroma -->
    <path d="M 60 70 C 50 30, 90 20, 100 45 C 90 70, 70 80, 60 70 Z" fill="#16A34A"/>
    <path d="M 100 45 C 110 20, 140 30, 135 60 C 120 75, 105 60, 100 45 Z" fill="#22C55E"/>
  </g>
  <!-- Text -->
  <text x="256" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">PATEL SAHAB</text>
  <text x="256" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">SPICES</text>
  <text x="256" y="445" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#E2E8F0" text-anchor="middle" letter-spacing="3">FACTORY INVENTORY</text>
</svg>
